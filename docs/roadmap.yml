# Roadmap: the single source of truth for the progress website's path.
#
# Hand-maintained alongside docs/PLAN.md (which explains the why). Edit the
# statuses (and add milestones) when a phase changes; tools/site_data.py
# computes each milestone's live progress on every merge and writes
# site/data/roadmap.json.
#
# status: done | active | next | later
# focus: true on the one phase the site opens on (optional; without it the
#   first active phase).
# hue: the phase colour on the site: green, red, blue, purple or gold.
# covers: what a milestone works on, as selectors:
#   main            all code of the main ELF (SLPM_666.75)
#   bin:lt80        functions under 80 bytes
#   bin:80-199      functions of 80-199 bytes
#   bin:200-999     functions of 200-999 bytes
#   bin:ge1k        functions of 1 KB and more
#   area:<dir>      one source area (a directory under src/, e.g. area:tozawa)
#   overlays        the five code overlays in OVL.IMG
# measure: how its progress is counted (optional; omit when it can't be
# measured from the build). `of` defaults to `covers`.
#   kind: code    bytes decompiled to C/C++ / all bytes of code
#   kind: fns     functions decompiled to C/C++ / all functions
# landed: commit(s) on `matching` that finished it (optional).
#
# Values are plain YAML scalars: quote any text that contains ": " or starts
# with a special character.

policies:
  - id: no-fakematch
    title: Assembly is not decompilation
    text: >-
      The whole executable builds from source and is byte-identical, but a
      function counts as decompiled only when it is C or C++ a programmer
      could have written. Functions kept as assembly, with inline CPU
      assembly or with a register pin are shown separately until they are
      rewritten. Vector-unit assembly that C cannot express is accepted.
  - id: names
    title: Names from the developers, not from a model
    text: >-
      Function, class and member names come from the debug information of the
      2014 PS3 E3 build. Each mapping to a PS2 function carries a confidence
      tier; unproven names keep their address.
  - id: review
    title: Adversarial review of hand-written work
    text: >-
      A separate reviewer that never saw the author's reasoning judges names,
      types and readability (ACCEPT / CHANGES / REJECT). Only ACCEPT merges.
  - id: verify
    title: Whole-ELF verification
    text: >-
      Every merge rebuilds the ELF and compares it byte for byte with
      SLPM_666.75.

phases:
  - id: foundations
    hue: gold
    title: A byte-identical build
    status: done
    summary: >-
      The whole main executable builds from source and matches the original
      byte for byte. Most of that matching was done by the zcroker fork, which
      this project adopted as its base in November 2026.
    milestones:
      - id: build
        title: SLPM_666.75 rebuilt from source
        desc: All 11,509 functions in the table are compiled and linked; the result is identical to the original.
        status: done
        covers: [main]
      - id: adopt
        title: One base instead of two efforts
        desc: >-
          The zcroker fork reached a full byte-identical build first. Its
          source became this project's base, with this project's rules,
          names, file map and site on top.
        status: done
        covers: []
      - id: native-build
        title: Build without Docker
        desc: The same build runs in a no-network sandbox (tools/sandbox.sh).
        status: done
        covers: []
      - id: quality
        title: Knowing what the source is made of
        desc: tools/quality.py classes every function as C/C++, vector-unit assembly, inline assembly, register pin or assembly file.
        status: done
        covers: []
      - id: site
        title: This progress website
        desc: Regenerated from a verified build on every merge.
        status: done
        covers: []

  - id: names
    hue: blue
    title: Real names
    status: active
    focus: true
    summary: >-
      Most functions still have address placeholders. The 2014 PS3 debug
      build has the developers' own names for about 7,600 of them.
    milestones:
      - id: names-high
        title: Top-tier names applied
        desc: 1,458 names from the tiers that tested 97 to 98 % correct, on top of the 1,700 the registry already had.
        status: done
        covers: []
      - id: names-overloads
        title: Overloads, constructors and destructors
        desc: About 130 top-tier names whose plain identifier is not unique need a naming scheme before they can be applied.
        status: next
        covers: []
      - id: names-lower
        title: Lower-tier names, checked
        desc: About 3,500 candidates in the tiers that tested 92 to 96 %; each needs a second piece of evidence before it is applied.
        status: next
        covers: []
      - id: names-conflicts
        title: Conflicting names resolved
        desc: 86 functions where the registry and the debug build disagree.
        status: next
        covers: []
      - id: globals
        title: Named globals
        desc: About 1,000 global variables matched by how the same functions use them on both platforms.
        status: later
        covers: []

  - id: clean
    hue: red
    title: Assembly out, C++ in
    status: next
    summary: >-
      About a third of the code is byte-identical only with help: assembly
      files, inline CPU assembly, register pins, or compiler flags switched
      per file. Each one is a function still to decompile properly.
    milestones:
      - id: attribute
        title: Every function classified
        desc: 1,247 functions sit in files where assembly could not yet be attributed to single functions.
        status: next
        covers: []
      - id: inline-asm
        title: Inline CPU assembly rewritten as C++
        desc: 607 functions; much of it is 128-bit copies the compiler generates itself from the right types.
        status: next
        covers: []
      - id: reg-pins
        title: Register pins removed
        desc: 84 functions pin a variable to a register to steer the compiler.
        status: next
        covers: []
      - id: asm-files
        title: Assembly files decompiled
        desc: 170 functions (79 KB) are still plain assembly, hand-written routines excepted.
        status: later
        covers: []
      - id: flags
        title: One set of compiler flags per library
        desc: Per-file flags that only switch off an optimisation pass are a steering trick; find the real source instead.
        status: later
        covers: []

  - id: readable
    hue: green
    title: Readable source
    status: next
    summary: Types, class layouts and the original file structure, so the code reads like the game it is.
    milestones:
      - id: file-map
        title: Original source files
        desc: The PS3 debug build gives 588 original files; functions move out of src/anon into the file that owned them.
        status: next
        covers: [area:anon]
      - id: classes
        title: Class layouts checked for PS2
        desc: About 5,900 types from the debug build; the HD version shifted many, so each is checked against PS2 offsets.
        status: next
        covers: []
      - id: members
        title: Members instead of offsets
        desc: Register-style code and raw offset access rewritten with named members, parameters and locals.
        status: later
        covers: []
      - id: gate
        title: Gate and review on every change
        desc: tools/gate.py and the review brief, adapted to this base.
        status: active
        covers: []

  - id: whole
    hue: purple
    title: The whole game
    status: later
    summary: Data owned by its files, the overlays, and a behaviour check against the original.
    milestones:
      - id: data
        title: Files own their data
        desc: Linked units already carry their data; the rest still takes data from the original image.
        status: later
        covers: []
      - id: overlays
        title: The five overlays
        desc: gumibattle, gumimenu, shop, title and movie; about 1.05 MB in OVL.IMG.
        status: later
        covers: [overlays]
      - id: harness
        title: Behaviour harness
        desc: The original and our build run side by side in PCSX2 on the same inputs.
        status: later
        covers: []
